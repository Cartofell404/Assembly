name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          targets: aarch64-apple-darwin
      - name: Install system dependencies
        run: brew install cmake llvm
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: macos-${{ matrix.rust }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # Clippy and rustfmt are only meaningful on the pinned stable toolchain;
      # beta picks up new lints and formatter changes, which would
      # fail unrelated PRs. Build and test still run on every toolchain.
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Fmt check
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: Install smoke test
        if: matrix.rust == 'stable'
        run: |
          cargo install --path crates/cli --locked --debug --root "$RUNNER_TEMP/asm-root"
          "$RUNNER_TEMP/asm-root/bin/assembly" --version

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
          targets: aarch64-apple-darwin
      - name: Install system dependencies
        run: brew install cmake llvm
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build on MSRV
        run: cargo build --workspace --locked

  audit:
    name: Dependency audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release Artifacts
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release
        run: cargo build --release --locked --bin assembly --target aarch64-apple-darwin
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/aarch64-apple-darwin/release/assembly "dist/assembly-macos-arm64"
          ls -la dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assembly-macos-14
          path: rust/dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: assembly-*
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          for f in assembly*; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
