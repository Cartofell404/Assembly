name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The unit tests never import llama_cpp, so they stay fast and do not
      # need a C++ toolchain. Building it here would triple CI time for
      # zero additional coverage.
      - name: Test
        run: pytest -q --cov=assembly --cov-report=term-missing

      - name: Compile check
        run: python -m compileall -q assembly

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip build
      - name: Build distributions
        run: python -m build
      - name: Check metadata
        run: |
          python - <<'PY'
          import pathlib, zipfile
          sdist = next(pathlib.Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(sdist) as z:
              names = z.namelist()
          assert any(n.endswith("LICENSE") for n in names), "LICENSE missing from sdist"
          print("ok:", sdist.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
