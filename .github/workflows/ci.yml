name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
        include:
          - os: ubuntu-latest
            rust: nightly
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake llvm
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake llvm -y
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.os }}-${{ matrix.rust }}
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
      # Clippy and rustfmt are only meaningful on the pinned stable toolchain;
      # beta and nightly pick up new lints and formatter changes, which would
      # fail unrelated PRs. Build and test still run on every toolchain.
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Fmt check
        if: matrix.rust == 'stable'
        run: cargo fmt --all --check
      - name: Install smoke test
        if: matrix.rust == 'stable' && runner.os == 'Linux'
        run: |
          cargo install --path crates/cli --locked --debug --root "$RUNNER_TEMP/asm-root"
          "$RUNNER_TEMP/asm-root/bin/assembly" --version

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build on MSRV
        run: cargo build --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build Release Artifacts
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build release
        run: cargo build --release --locked --bin assembly
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            Linux)   name=assembly-linux-x86_64 ;;
            macOS)   name=assembly-macos-$(uname -m) ;;
            Windows) name=assembly-windows-x86_64.exe ;;
          esac
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/release/assembly.exe "dist/$name"
          else
            cp target/release/assembly "dist/$name"
          fi
          ls -la dist
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assembly-${{ matrix.os }}
          path: rust/dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: assembly-*
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          for f in assembly*; do
            sha256sum "$f" > "$f.sha256"
          done
          ls -la
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
