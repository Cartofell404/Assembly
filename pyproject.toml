[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-engine"
description = "Multi-model GGUF router that packs several models into one archive and serves them behind OpenAI- and Ollama-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Assembly Team" }]
keywords = ["llm", "gguf", "router", "llama.cpp", "inference", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "llama-cpp-python>=0.2.70",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/assembly-engine/assembly"
Issues = "https://github.com/assembly-engine/assembly/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
assembly = "assembly.main:main"

[tool.setuptools.dynamic]
version = { attr = "assembly.__version__" }

[tool.setuptools.packages.find]
include = ["assembly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
