[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-engine"
description = "Multi-model GGUF router that packs several models into one archive and serves them behind OpenAI- and Ollama-compatible APIs"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Assembly Team" }]
keywords = ["llm", "gguf", "router", "llama.cpp", "inference", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "llama-cpp-python>=0.2.70",
    "numpy>=1.24",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/assembly-engine/assembly"
Issues = "https://github.com/assembly-engine/assembly/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
# readline is a stdlib module on macOS and Linux but a separate distribution on
# Windows, where its absence costs the REPL its line editing and history.
# Declared as a Windows-only extra so macOS/Linux installs are unaffected.
history = [
    "pyreadline3>=3.4; sys_platform == 'win32'",
]

[project.scripts]
assembly = "assembly.main:main"

[tool.setuptools.dynamic]
version = { attr = "assembly.__version__" }

[tool.setuptools.packages.find]
include = ["assembly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["assembly"]
branch = true

# A floor, not a target. Much of the codebase is only reachable with a real
# multi-gigabyte model, so full coverage is not reachable in CI. This just
# stops coverage from silently going backwards.
[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
